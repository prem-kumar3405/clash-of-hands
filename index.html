<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
   <div class="title">
    <h1>Clash of <span class="red">Hands</span></h1>

    <p>stone paper scissors battle</p>

   </div> 

   <div class="box">
    <h1>choose a weapon to play</h1>
    <div class="weapon">
        <button type="submit" class="stone" onclick="stone()"></button>
        <button class="paper" onclick="paper()"></button>
        <button class="scissors" onclick="scissors()"></button>
    </div>
    <div class="selection">
    <img src="stone.jpeg" alt="" id="user">
    <h1>vs</h1>
    <img src="paper.jpeg" alt="" id="computer">
    </div>

    <div class="ans" id="result">
        <p>result</p>
    </div>

   </div>
   <div class="dev">
    <p>This game is developed by prem</p>
   </div>
   </div>
   

</body>
</html>
